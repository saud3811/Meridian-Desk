name: Refresh and deploy

on:
  schedule:
    # Every 2 hours, in UTC. GitHub may delay a scheduled run under load.
    - cron: "0 */2 * * *"
  workflow_dispatch:        # rebuild on demand from the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "data/last-run.txt"   # the heartbeat commit must not retrigger this

permissions:
  contents: write   # needed only for the heartbeat commit
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a scheduled run is
# not thrown away because a push landed at the same moment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The secrets context cannot be used in a step-level `if`, so resolve it
      # to a plain string here and test that instead.
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Anthropic SDK (only when a key is configured)
        if: env.HAS_API_KEY == 'true'
        run: pip install "anthropic>=0.40"

      - name: Pull headlines
        run: python src/fetch_news.py data/news_data.json

      - name: Refuse to deploy a degraded pull
        # A bad network run would otherwise publish a near-empty dashboard over
        # a good one. Fail here instead, leaving the last good deploy live.
        run: |
          python - <<'PY'
          import json, sys
          c = json.load(open("data/news_data.json"))["counts"]
          print(f"{c['total']} items, {c['feeds_ok']}/{c['feeds_total']} feeds responding")
          if c["total"] < 150 or c["feeds_ok"] < 25:
              sys.exit("degraded pull - keeping the previous deploy live")
          PY

      - name: Write the brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python src/make_summary.py data/news_data.json data/summary.json 24

      - name: Build the page
        run: python src/build.py

      - name: Heartbeat
        # GitHub disables scheduled workflows after 60 days without repository
        # activity. This one-line commit keeps the schedule alive. It is excluded
        # from the push trigger above, so it cannot cause a loop.
        continue-on-error: true
        run: |
          mkdir -p data
          date -u +"last successful build: %Y-%m-%dT%H:%M:%SZ" > data/last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last-run.txt
          git diff --staged --quiet || git commit -m "heartbeat: keep the schedule alive [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
